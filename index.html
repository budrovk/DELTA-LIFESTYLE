<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Delta Life</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef4f2;--ink:#12263a;--card:#fff;--mut:#5b6f7e;--acc:#f2c14e;--cr:#1f7a8c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1b26;--ink:#e8f0f2;--card:#16293a;--mut:#93a8b5}}
:root[data-theme="dark"]{--bg:#0d1b26;--ink:#e8f0f2;--card:#16293a;--mut:#93a8b5}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,sans-serif}
.w{max-width:480px;margin:auto;padding:16px}
h1{font-size:2.4rem;font-weight:800;margin:0;letter-spacing:-.02em}
.sub{color:var(--mut);margin:2px 0 14px}
.top{display:flex;justify-content:space-between;align-items:baseline}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.b{background:var(--card);border-radius:10px;padding:8px 10px;font-size:.85rem}
.b i{display:block;height:6px;border-radius:3px;background:var(--cr);margin-top:5px}
.loc{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
button{font:inherit;border:0;border-radius:10px;padding:12px;background:var(--card);color:var(--ink);text-align:left;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc)}
.loc button{white-space:nowrap;padding:8px 12px}
.loc .on{background:var(--ink);color:var(--bg)}
.acts{display:grid;gap:8px;margin:10px 0}
.acts button b{display:block}
.acts button span{color:var(--mut);font-size:.8rem}
.hot{background:var(--acc)!important;color:#12263a!important}
.hot span{color:#3b2a20!important}
.sch{border-left:5px solid var(--cr)}
#log{white-space:pre-line;background:var(--card);border-radius:10px;padding:10px;min-height:70px;font-size:.92rem;line-height:1.5}
input{display:block;width:100%;box-sizing:border-box;font:inherit;padding:12px;margin:8px 0;border-radius:10px;border:2px solid var(--mut);background:var(--card);color:var(--ink)}
#auth .row{display:flex;gap:8px}#auth .row button{flex:1;text-align:center;font-weight:800}
#auth .go{background:var(--acc);color:#12263a}
#err{color:#c0392b;min-height:1.3em;font-size:.9rem}
.s{display:flex;justify-content:space-between;color:var(--mut);font-size:.85rem;margin-top:10px}
.s button{padding:6px 10px;font-size:.85rem}
.views{display:flex;gap:6px;margin:8px 0}.views button{padding:6px 12px}.views .on{background:var(--ink);color:var(--bg)}
#walk{border-radius:12px;overflow:hidden;background:#9fd3f5;min-height:120px}
#look{background:var(--card);border-radius:12px;padding:12px}
.row{margin:8px 0;font-size:.85rem}.sw{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.sw button{min-width:34px;height:34px;padding:0 10px;border:2px solid transparent;border-radius:17px;background:var(--bg);color:var(--ink)}
.sw .sel{border-color:var(--cr);outline:2px solid var(--acc)}
</style></head><body><div class="w">
<div id="auth" hidden>
<h1>Delta Life</h1>
<p class="sub">Create an account and get ₦3,000,000 to start your Delta story.</p>
<input id="em" type="email" placeholder="Email" autocomplete="email">
<input id="pw" type="password" placeholder="Password (6+ characters)" autocomplete="current-password">
<div id="err"></div>
<div class="row"><button class="go" id="su">Create account</button><button id="li">Log in</button></div>
<p class="sub" style="font-size:.8rem;margin-top:14px">Your progress is saved to your account on the server.</p>
</div>
<div id="game" hidden>
<div class="top"><h1>Delta Life</h1><div id="day"></div></div>
<p class="sub" id="sub"></p>
<div class="bars" id="bars"></div>
<div class="loc" id="loc"></div>
<div class="views" id="views"><button data-v="walk">Walk</button><button data-v="list">List</button><button data-v="look">My look</button></div>
<div id="walk"></div>
<div id="look" hidden><div id="pv"></div><div id="opts"></div><button id="sv" class="hot" style="margin-top:8px;width:100%;text-align:center"><b>Save my look</b></button></div>
<div class="acts" id="acts"></div>
<div id="log"></div>
<div class="s"><span id="who"></span><span><button id="lb">Leaderboard</button> <button id="rs">Restart</button> <button id="lo">Log out</button></span></div>
</div></div>
<script src="/game.js"></script>
<script>
// Action: [label, money, energy, fullness, mood, story]
const {L,T,GOAL,SHOP,fresh,ng}=G,$=id=>document.getElementById(id);
let tok=null,cur=null,s=null,tm=0;
try{tok=localStorage.getItem("dl_tok")}catch(x){}
async function api(p,b){const r=await fetch("/api/"+p,{method:"POST",headers:{"Content-Type":"application/json",...(tok?{Authorization:"Bearer "+tok}:{})},body:JSON.stringify(b||{})});
 const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"Request failed");return j}
function start(em,sv){cur=em;s=sv||fresh();try{localStorage.setItem("dl_tok",tok)}catch(x){}$("auth").hidden=true;$("game").hidden=false;draw()}
async function auth(isNew){
 const em=$("em").value.trim().toLowerCase(),pw=$("pw").value,er=$("err");
 if(!/^\S+@\S+\.\S+$/.test(em))return er.textContent="Enter a valid email.";
 if(pw.length<6)return er.textContent="Password must be at least 6 characters.";
 try{const j=await api(isNew?"signup":"login",{email:em,password:pw});tok=j.token;er.textContent="";$("pw").value="";start(j.email,j.save)}
 catch(x){er.textContent=x.message==="Failed to fetch"?"Cannot reach the server. Is it running?":x.message}}
async function resume(){if(!tok)return false;try{const j=await api("me");start(j.email,j.save);return true}catch(x){return false}}
let busy=false,view='walk',town=null,pv=null,draft=null,tmod=null;
async function send(c){if(busy)return;busy=true;try{const j=await api("do",c);s=j.state;draw()}catch(x){s.log=x.message;draw()}busy=false}
function draw(){
 const P=L[s.l];
 $("sub").textContent="Reach "+ng(GOAL)+" to win. Certificate: "+s.deg+(s.mult>1?" (pay x"+s.mult+")":"");
 $("day").textContent="Day "+s.d+" · "+T[s.t];$("who").textContent=cur;
 const bar=(n,v)=>`<div class="b">${n} ${v}<i style="width:${v}%"></i></div>`;
 $("bars").innerHTML=`<div class="b">Money<br><b>${ng(s.m)}</b></div>`+bar("Energy",s.e)+bar("Belle",s.f)+bar("Mood",s.mo);
 $("loc").innerHTML=Object.keys(L).map(p=>`<button class="${p==s.l?"on":""}" data-p="${p}">${p}</button>`).join("");
 let h=P.a.map((a,i)=>`<button data-i="${i}"><b>${a[0]}</b><span>${a[1]>=0?"+":""}${ng(a[1])}${a[1]>0&&s.mult>1?" x"+s.mult:""} · energy ${a[2]}</span></button>`).join("");
 if(s.edu&&s.edu.town==s.l)h+=`<button class="sch" data-c="1"><b>Attend class: ${s.edu.n}</b><span>${s.edu.p}/${s.edu.need} · energy -15</span></button>`;
 else if(!s.edu)h+=P.sch.map((c,i)=>`<button class="sch" data-e="${i}"><b>Enroll: ${c[0]}</b><span>${ng(c[1])} · ${c[2]} classes · ${c[3]}</span></button>`).join("");
 h+=`<button data-s="1"><b>Buy a shop</b><span>${ng(SHOP)} · earns ₦20,000 daily · you own ${s.shops}</span></button>`;
 h+=`<button class="hot" data-h="1"><b>Sleep at ${P.hotel[0]}</b><span>${ng(P.hotel[1])} · full energy, new day</span></button>`;
 $("acts").innerHTML=h;$("log").textContent=s.log;views()}
const HAIRN=["Short","Afro","Braids","Bald"];
function editor(){const P=tmod.PAL,rows=[["Skin","skin",P.SKIN],["Hair","hair",HAIRN],["Hair colour","hc",P.HAIR],["Top","top",P.TOP],["Trousers","bot",P.BOT],["Cap","cap",["Off","On"]]];
 $("opts").innerHTML=rows.map(([n,k,o])=>`<div class="row">${n}<div class="sw">`+o.map((c,i)=>`<button data-k="${k}" data-o="${i}" class="${draft[k]==i?"sel":""}"${c[0]=="#"?` style="background:${c}"`:""}>${c[0]=="#"?"":c}</button>`).join("")+"</div></div>").join("");
 if(pv)pv.update(draft)}
async function views(){
 if(!s)return;
 $("acts").style.display=view=="list"?"":"none";$("walk").hidden=view!="walk";$("look").hidden=view!="look";
 document.querySelectorAll("#views button").forEach(b=>b.classList.toggle("on",b.dataset.v==view));
 if(town)town.pause(view!="walk");
 if(view=="list")return;
 if(!tmod){try{tmod=await import("/town3d.js")}catch(x){$("walk").textContent="Could not load 3D. Use the List view.";return}}
 if(view=="walk"){if(!town)town=tmod.mountTown($("walk"),{cmd:c=>send(c),busy:()=>busy});town.update(s,s.av||tmod.DEF);town.pause(false)}
 if(view=="look"){if(!draft)draft={...tmod.DEF,...(s.av||{})};if(!pv)pv=tmod.mountPreview($("pv"));editor()}}
async function saveLook(){try{const j=await api("avatar",draft);s=j.state;s.log="Your new look is saved.";draw()}catch(x){s.log=x.message;draw()}}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const d=b.dataset;
 if(b.id=="su")auth(true);else if(b.id=="li")auth(false);
 else if(b.id=="lo"){tok=null;cur=null;s=null;try{localStorage.removeItem("dl_tok")}catch(x){}$("game").hidden=true;$("auth").hidden=false}
 else if(b.id=="rs")send({t:"reset"});
 else if(b.id=="lb")board();
 else if(!s)return;
 else if(d.v){view=d.v;views()}
 else if(d.k){draft[d.k]=+d.o;editor()}
 else if(b.id=='sv')saveLook();
 else if(d.p)send({t:"go",p:d.p});else if(d.i)send({t:"act",i:+d.i});else if(d.e)send({t:"enroll",i:+d.e});else if(d.c)send({t:"cls"});else if(d.s)send({t:"shop"});else if(d.h)send({t:"hotel"})});
async function board(){try{const r=await(await fetch("/api/leaderboard")).json();
 $("log").textContent="Top Delta players (net worth)\n"+r.map((x,i)=>(i+1)+". "+x.name+" - "+ng(x.net)+" - Day "+x.day+" - "+x.deg).join("\n")}catch(x){$("log").textContent="Cannot load leaderboard."}}
document.addEventListener("keydown",e=>{if(e.key=="Enter"&&!$("auth").hidden)auth(false)});
resume().then(ok=>{if(!ok)$("auth").hidden=false});
</script></body></html>
